spring:
  application:
    name: servicio-venta
  datasource:
    url: jdbc:h2:file:./data/ventas;MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
server:
  port: 9003
thanosgym:
  clientes:
    url: ${CLIENTES_URL:http://localhost:9001}
  membresias:
    url: ${MEMBRESIAS_URL:http://localhost:9002}
  integraciones:
    validar: ${VALIDAR_INTEGRACIONES:true}
    connect-timeout-ms: ${CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${READ_TIMEOUT_MS:3000}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
---
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3309/thanosgym_ventas?createDatabaseIfNotExist=true&serverTimezone=America/Lima}
    username: ${DB_USER:thanosgym}
    password: ${DB_PASSWORD:thanosgym}
